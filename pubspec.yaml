name: klugmind
description: "AI study planner and active recall engine."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # --- AI material-analysis pipeline (OCR + voice + LLM) ---
  google_mlkit_text_recognition: ^0.15.0
  speech_to_text: ^7.0.0
  http: ^1.2.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  file_picker: ^10.3.0
  flutter_dotenv: ^5.2.1
  syncfusion_flutter_pdf: ^33.2.13
  flutter_gemma: ^0.16.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Generates launcher icons for Android, iOS and web.
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/klugmind_logo.png"
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "assets/images/klugmind_logo.png"
  adaptive_icon_foreground_inset: 0   # removes the 16% shrink
  web:
    generate: true
    image_path: "assets/images/klugmind_logo.png"
    background_color: "#0B0B0D"
    theme_color: "#3B5BFD"

flutter:
  uses-material-design: true

  # .env for flutter_dotenv: non-secret config only (e.g. proxy base URL).
  # Never put API keys here, since assets ship inside the APK/IPA.
  assets:
    - .env
    - assets/images/